<h1>Registro de usuario</h1>
<div class="form-wrapper">
    <form action="#" method="post">
    
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" placeholder="Nuevo usuario"/><br/>


      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Nombre Completo" /><br />

      <label for="movil">Telefono</label>
      <input type="tel" id="movil" name="movil" placeholder="(+57)311000000" /><br />

      <label for="fecha">Fecha de nacimiento</label>
      <input type="date" id="fecha" name="fecha" value="1950-01-01" /><br />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="usuario@email.com" /><br />

      <label for="Contraseña">Contraseña</label>
      <input type="text" id="Contraseña" name="Contraseña" placeholder="Nueva clave"/><br/>
    
      <label for="Contraseña">Confirme contraseña</label>
      <input type="text" id="Confirme contraseña" name="Confirme contraseña" placeholder="Confirme clave"/><br/>

      <div class="form-botones">
        <input type="submit" value="Enviar" />
        <input type="reset" value="Borrar datos" />
      </div>
    </form>
</div>
