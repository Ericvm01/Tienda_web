<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="estilos/estilos.css">
  <title>Contacto</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>
<body>
  <h1>FromsoftStore</h1>
<nav>
    <a href="Inicio.html">Inicio</a>
    <a href="Juegos.html">Juegos</a>
    <a href="Registro.html">Registro</a>
    <a href="Iniciar.html">Ingreso</a>
  </nav>
  
      <center>
        <img src="Imagenes/Logo.png" alt="" id="imgLogo"> 
      </center>


  <h1>Pedidos</h1>

  <div class="form-wrapper">
    <form action="#" method="post">

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Nombre Completo" /><br />

      <label for="movil">Telefono</label>
      <input type="tel" id="movil" name="movil" placeholder="(+57)311000000" /><br />


      <label for="email">Email</label>
      <input type="email" id="email" placeholder="usuario@email.com" /><br />

       

      <fieldset>
        <legend>Juego preferido</legend>
        <label><input type="radio" name="estado" value="soltero" /> Elden Ring</label><br />
        <label><input type="radio" name="estado" value="casado" /> Bloodborne game of the year</th></label><br />
        <label><input type="radio" name="estado" value="separado" /> Dark souls 3 Deluxe Edition </label><br />
        
      </fieldset>

      
      <fieldset>
        <legend>Desea información de:</legend>
        <label><input type="checkbox" name="info" value="deportes" /> Disponibilidad</label><br />
        <label><input type="checkbox" name="info" value="lenguajes" /> Precio</label><br />
        
      </fieldset>

      <label for="ciudad">Seleccionar ciudad de residencia:</label>
      <select id="ciudad" name="ciudad">
        <option value="medellin">Medellín</option>
        <option value="bogota">Bogotá</option>
        <option value="cali">Cali</option>
        <option value="Barranquilla">Barranquilla</option>
      </select><br />

      <fieldset>
        <div class="campo">
    <label for="direccion">Dirección</label>
    <input 
      type="text" 
      id="direccion" 
      name="direccion" 
      placeholder="Calle 45 #23-10"
      autocomplete="street-address"
    >
  </div>

    <div class="campo">
    <label for="adicional">Apartamento / Piso (opcional)</label>
    <input 
      type="text" 
      id="adicional" 
      name="adicional" 
      placeholder="Apto 301, Torre B"
      autocomplete="address-line2"
    >
  </div>


      </fieldset>

      <label for="comentarios">Comentarios:</label><br />
      <textarea id="comentarios" name="comentarios" rows="6" cols="40"
        placeholder="Escribe aquí tu comentario..."></textarea><br />

      <div class="form-botones">
        <input type="submit" value="Enviar formulario" />
        <input type="reset" value="Reiniciar" />
        
      </div>

    </form>
  </div>

 

</body>
</html>
